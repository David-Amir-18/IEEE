<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEEE EMBS Members</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .member-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
            border: 4px solid transparent;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .member-card.not-contacted {
            border-color: #dc3545;
            background: linear-gradient(to bottom, #fff5f5 0%, white 100%);
        }

        .member-card.contacted-no-interview {
            border-color: #ffc107;
            background: linear-gradient(to bottom, #fffef0 0%, white 100%);
        }

        .member-card.contacted-scheduled {
            border-color: #28a745;
            background: linear-gradient(to bottom, #f0fff4 0%, white 100%);
        }

        .member-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-info {
            color: #666;
            margin-bottom: 8px;
            display: flex;
            align-items: start;
            gap: 8px;
            font-size: 0.95em;
        }

        .info-icon {
            color: #667eea;
            min-width: 20px;
        }

        .committee-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .no-results h2 {
            color: #666;
            font-size: 1.5em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 60px 20px;
        }

        .expand-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .expand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .expand-icon {
            font-size: 0.8em;
            transition: transform 0.3s;
        }

        .answers-section {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .answer-item {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .question {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .answer {
            color: #555;
            line-height: 1.6;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .interview-section {
            margin-top: 20px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            border: 2px solid #667eea;
        }

        .contact-status-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d0d0e0;
        }

        .contact-switch-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .contact-label-text {
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .contact-status-text {
            font-weight: 600;
            font-size: 0.9em;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #28a745;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .interview-header {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .interview-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .interview-field {
            display: flex;
            flex-direction: column;
        }

        .interview-field label {
            font-size: 0.85em;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .interview-time-input,
        .interview-mode-select,
        .interview-notes {
            padding: 10px;
            border: 2px solid #d0d0d0;
            border-radius: 6px;
            font-size: 0.9em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .interview-time-input:focus,
        .interview-mode-select:focus,
        .interview-notes:focus {
            outline: none;
            border-color: #667eea;
        }

        .interview-notes {
            min-height: 60px;
            resize: vertical;
        }

        .interview-status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            text-align: center;
        }

        .interview-status.scheduled {
            background: #d4edda;
            color: #155724;
        }

        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
            margin-top: 10px;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }

        .save-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .save-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .interview-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IEEE EMBS Members Directory</h1>
            <div class="stats" id="stats"></div>
            <button class="export-btn" onclick="exportSchedule()">📥 Export Interview Schedule</button>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="searchInput">Search by Name</label>
                <input type="text" id="searchInput" placeholder="Enter name...">
            </div>
            <div class="filter-group">
                <label for="universityFilter">University</label>
                <select id="universityFilter">
                    <option value="">All Universities</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="committeeFilter">Committee</label>
                <select id="committeeFilter">
                    <option value="">All Committees</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="majorFilter">Major</label>
                <select id="majorFilter">
                    <option value="">All Majors</option>
                </select>
            </div>
        </div>

        <div class="members-grid" id="membersGrid">
            <div class="loading">Loading members...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Your App -->
    <script src="app.js"></script>
</body>
</html>
